  // ↑↑↑ 貼り替えるとクラウド保存＆本物の全体ランキングが有効になります ↑↑↑

  const CLOUD_ON = SUPA_URL.indexOf("https://")===0 && SUPA_URL.indexOf("PASTE")===-1 && typeof supabase!=="undefined";
  const sb = CLOUD_ON ? supabase.createClient(SUPA_URL, SUPA_KEY) : null;

  // 起動時に匿名ログイン（既ログインならスキップ）。摩擦ゼロで保存できる。
  async function ensureAuth(){
    if(!sb) return null;
    const { data:{ session } } = await sb.auth.getSession();
    if(!session){ await sb.auth.signInAnonymously(); }
    const { data:{ user } } = await sb.auth.getUser();
    return user;
  }

  // クイズ結果をクラウド保存し、本物の順位を返す。未設定・失敗時は null（推定値にフォールバック）。
  async function saveResultToCloud(difficulty, correct, total, timeSec, score){
    if(!sb) return null;
    try{
      const user = await ensureAuth();
      if(!user) return null;
      await sb.from("quiz_results").insert({ user_id:user.id, difficulty, correct, total, time_sec:timeSec, score });
      const { data } = await sb.rpc("get_rank", { p_user:user.id, p_difficulty:difficulty });
      return (data && data[0]) || null; // { rank, total_players, top_percent }
    }catch(e){ return null; }
  }
</script>

function rankIdx(name){ return RANKS.findIndex(r=>r.name===name); }
function isUnlocked(ico, best){
  const c = ico.cond;
  if(!c) return true;
  if(c.shindan) return !!best.shindan;
  if(c.plays) return (best.plays||0) >= c.plays;
  if(c.allChobe) return ["easy","normal","hard"].every(d=> best[d] && rankIdx(best[d].rank)===0);
  if(c.diff){ const b=best[c.diff]; if(!b) return false; const idx=rankIdx(b.rank); return idx>=0 && idx<=c.maxIdx; }
  return false;
}

const app = document.getElementById("app");
let deck=[], cur=0, score=0, diffKey="normal", thinkMs=0, qStart=0;
let sq=0, sscore={};

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function getRank(ratio){ return RANKS.find(x => ratio >= x.r); }
function loadBest(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; } }
function saveBest(o){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(o)); }catch(e){} }

function calcScore(correct, secs){ return correct*1000 + Math.max(0, 2000 - Math.round(secs*8)); }

// 結果カードを画像化してシェア（無理なら文章シェアにフォールバック）
async function shareCard(captureId, shareText){
  const el = document.getElementById(captureId);
  if(!el || typeof html2canvas==="undefined"){ doTextShare(shareText); return; }
  try{
    const canvas = await html2canvas(el, { backgroundColor:"#ffe3ef", scale:2, useCORS:true });
    canvas.toBlob(async (blob)=>{
      if(!blob){ doTextShare(shareText); return; }
      const file = new File([blob], "heisei-result.png", { type:"image/png" });
      if(navigator.canShare && navigator.canShare({ files:[file] })){
        try{ await navigator.share({ files:[file], text:shareText }); return; }catch(e){ if(e && e.name==="AbortError") return; }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href=url; a.download="heisei-result.png"; a.click();
      URL.revokeObjectURL(url);
    }, "image/png");
  }catch(e){ doTextShare(shareText); }
}
function doTextShare(shareText){
  if(navigator.share){ navigator.share({ title:"平成あるある診断", text:shareText, url:location.href }); }
  else { window.open("https://twitter.com/intent/tweet?text="+encodeURIComponent(shareText+"\n"+location.href), "_blank"); }
}
function openLine(){ window.open("https://social-plugins.line.me/lineit/share?url="+encodeURIComponent(location.href), "_blank"); }
function estPercentile(ratio, avgSec){
  let top = ratio>=0.9?8 : ratio>=0.7?25 : ratio>=0.5?50 : ratio>=0.3?75 : 92;
  if(avgSec < 6) top -= 6; else if(avgSec > 14) top += 6;
  return Math.min(99, Math.max(1, Math.round(top)));
}

function renderStart(){
  let h = `<div class="center"><div class="kao" style="font-size:22px;margin-bottom:6px">(^o^)／ ＼(^_^)</div>`;
  h += `<div class="sub" style="margin-bottom:14px">好みで分かる「平成タイプ診断」か、知識で競う「クイズ」を選んでね</div></div>`;
  h += `<button class="diff" id="toShindan" style="border-style:dashed"><b>平成タイプ診断 <span class="kao" style="display:inline">(★ω★)</span></b><span>好みに答えるだけ・知識いらず／あなたは何系？</span></button>`;
  h += `<div class="sub center" style="margin:8px 0">― または クイズで腕試し ―</div>`;
  DIFF_ORDER.forEach(k=>{
    const p = POOLS[k];
    h += `<button class="diff" data-k="${k}"><b>${p.label} <span class="kao" style="display:inline">${p.kao}</span></b><span>${p.desc}</span></button>`;
  });
  h += `<button class="btn btn-ghost" id="toProf"><i></i>マイ戦績（プロフ）を見る ▸</button>`;
  app.innerHTML = h;
  app.querySelectorAll(".diff[data-k]").forEach(b=> b.addEventListener("click", ()=> startGame(b.dataset.k)));
  document.getElementById("toShindan").addEventListener("click", startShindan);
  document.getElementById("toProf").addEventListener("click", renderProfile);
}

function startShindan(){ sq=0; sscore={}; TYPE_ORDER.forEach(k=>sscore[k]=0); renderShindanQ(); }
function renderShindanQ(){
  const item = SHINDAN_Q[sq];
  const opts = shuffle(item.opts.slice());
  const pct = Math.round((sq/SHINDAN_Q.length)*100);
  let h = `<div class="lcd"><span>Tﾟﾟﾟ 圏内</span><span>診断モード</span><span>■■■□</span></div>`;
  h += `<div class="topbar"><span>平成タイプ診断　${sq+1}/${SHINDAN_Q.length}</span><span class="kao">(★ω★)</span></div>`;
  h += `<div class="bar"><div style="width:${pct}%"></div></div>`;
  h += `<div class="q-text">${item.q}</div>`;
  opts.forEach((o,i)=>{ h += `<button class="btn" data-i="${i}">${o.t}</button>`; });
  app.innerHTML = h;
  app.querySelectorAll(".btn").forEach(b=> b.addEventListener("click", ()=> answerShindan(opts[parseInt(b.dataset.i)])));
}
function answerShindan(opt){
  for(const k in opt.p){ sscore[k] = (sscore[k]||0) + opt.p[k]; }
  sq++;
  sq < SHINDAN_Q.length ? renderShindanQ() : renderShindanResult();
}
function renderShindanResult(){
  let top = TYPE_ORDER[0];
  TYPE_ORDER.forEach(k=>{ if(sscore[k] > sscore[top]) top = k; });
  const t = TYPES[top], ai = TYPES[t.aisho];
  const best = loadBest(); best.shindan = {type:top, name:t.name, kao:t.kao}; saveBest(best);
  let h = `<div class="puri center" id="capCardS">`;
  h += `<span class="deco" style="top:6px;left:8px">★</span><span class="deco" style="top:6px;right:8px">♥</span>`;
  h += `<span class="deco" style="bottom:6px;left:10px;font-size:13px">✨</span><span class="deco" style="bottom:6px;right:10px;font-size:13px">✨</span>`;
  h += `<div class="puri-cap">★ あなたの平成タイプ ★</div>`;
  h += `<div style="font-size:30px;margin:2px 0" class="kao">${t.kao}</div>`;
  h += `<div class="puri-rank" style="font-size:26px">${t.name}</div>`;
  h += `<div class="sub" style="margin:4px 12px 0">${t.desc}</div>`;
  h += `</div>`;
  h += `<div class="center">`;
  h += `<div style="background:var(--pink-l);border-radius:12px;padding:8px 12px;margin:0 0 8px;font-size:13px;color:var(--pink-d)">あるある：${t.aru}</div>`;
  h += `<div><span class="pill">同じタイプは約${t.pct}%</span><span class="pill lite">相性◎ ${ai.name} ${ai.kao}</span></div>`;
  h += `<div class="sub" style="margin-top:6px">※割合・相性はSTEP2で実データに接続</div>`;
  h += `</div>`;
  const shareText = `【平成タイプ診断】私は「${t.name}」${t.kao}\n${t.aru}\nあなたは何系？ #平成あるある #平成タイプ診断`;
  h += `<button class="btn btn-primary" id="share">📸 結果を画像でシェア</button>`;
  h += `<button class="btn" id="shareLine">LINEで友達に送る</button>`;
  h += `<button class="btn" id="retry">もう一度診断する</button>`;
  h += `<button class="btn btn-ghost" id="toQuiz">クイズで腕試しする ▸</button>`;
  h += `<button class="btn btn-ghost" id="toProf">マイ戦績（プロフ）を見る ▸</button>`;
  h += `<div class="credit">平成あるある診断 / prototype</div>`;
  app.innerHTML = h;
  document.getElementById("retry").addEventListener("click", startShindan);
  document.getElementById("toQuiz").addEventListener("click", renderStart);
  document.getElementById("toProf").addEventListener("click", renderProfile);
  document.getElementById("share").addEventListener("click", ()=> shareCard("capCardS", shareText));
  document.getElementById("shareLine").addEventListener("click", openLine);
}

function startGame(k){
  diffKey = k;
  const pool = POOLS[k].qs.slice();
  deck = shuffle(pool).slice(0, N_PER_GAME).map(o=>({ q:o.q, e:o.e, opts: shuffle(o.a.map((t,i)=>({t, ok:i===o.c}))) }));
  cur=0; score=0; thinkMs=0;
  renderQuestion();
}

function renderQuestion(){
  const item = deck[cur];
  const pct = Math.round((cur/deck.length)*100);
  let h = `<div class="lcd"><span>Tﾟﾟﾟ 圏内</span><span>${POOLS[diffKey].label}</span><span>■■■□</span></div>`;
  h += `<div class="topbar"><span>${POOLS[diffKey].label}　${cur+1}/${deck.length}</span><span>正解 ${score}</span></div>`;
  h += `<div class="bar"><div style="width:${pct}%"></div></div>`;
  h += `<div class="q-text">${item.q}</div>`;
  item.opts.forEach((o,i)=>{ h += `<button class="btn" data-i="${i}">${o.t}</button>`; });
  h += `<div class="explain" id="ex">${item.e}</div>`;
  app.innerHTML = h;
  app.querySelectorAll(".btn").forEach(b=> b.addEventListener("click", ()=> answer(parseInt(b.dataset.i))));
  qStart = Date.now();
}

function answer(i){
  thinkMs += Date.now() - qStart;
  const item = deck[cur];
  const btns = app.querySelectorAll(".btn");
  btns.forEach((b,idx)=>{ b.disabled=true; if(item.opts[idx].ok) b.classList.add("correct"); else if(idx===i) b.classList.add("wrong"); });
  if(item.opts[i].ok) score++;
  document.getElementById("ex").classList.add("show");
  const next = document.createElement("button");
  next.className = "btn btn-primary";
  next.textContent = cur < deck.length-1 ? "次の問題へ ▸" : "結果を見る ▸";
  next.style.marginTop = "12px";
  next.addEventListener("click", ()=>{ cur++; cur < deck.length ? renderQuestion() : renderResult(); });
  app.appendChild(next);
}

function renderResult(){
  const total = deck.length;
  const ratio = score/total;
  const secs = Math.round(thinkMs/1000);
  const avgSec = thinkMs/1000/total;
  const sc = calcScore(score, thinkMs/1000);
  const pct = estPercentile(ratio, avgSec);
  const rk = getRank(ratio);
  const dlabel = POOLS[diffKey].label;

  const best = loadBest();
  const prev = best[diffKey];
  const isNew = !prev || sc > prev.score;
  if(isNew){ best[diffKey] = {rank:rk.name, correct:score, total, secs, score:sc, pct}; }
  best.plays = (best.plays||0) + 1;
  saveBest(best);

  let h = `<div class="puri center" id="capCard">`;
  h += `<span class="deco" style="top:6px;left:8px">★</span><span class="deco" style="top:6px;right:8px">♥</span>`;
  h += `<span class="deco" style="bottom:6px;left:10px;font-size:13px">✨</span><span class="deco" style="bottom:6px;right:10px;font-size:13px">✨</span>`;
  h += `<div class="puri-cap">★ ${dlabel} のけっか ★</div>`;
  h += `<div class="puri-rank">${rk.name}</div>`;
  h += `<div class="sub">${rk.sub}</div>`;
  h += `</div>`;
  h += `<div class="stat-row">`;
  h += `<div class="stat"><b>${score}/${total}</b><span>正解数</span></div>`;
  h += `<div class="stat"><b>${secs}秒</b><span>回答時間</span></div>`;
  h += `<div class="stat"><b>${sc.toLocaleString()}</b><span>スコア</span></div>`;
  h += `</div>`;
  h += `<div class="center"><span class="pill" id="rankPill"><i class="ti ti-trophy"></i> 推定 上位 ${pct}%</span>`;
  if(isNew) h += `<span class="pill lite">自己ベスト更新！</span>`;
  h += `<div class="sub" id="rankNote" style="margin-top:6px">${CLOUD_ON ? "全体ランキングを集計中…" : "※全体ランキングはSTEP2（サーバー接続）で本実装"}</div></div>`;
  if(diffKey==="hard" && ratio>=0.7) h += `<div class="center sub" style="color:var(--pink-d)">上級でこのスコアは本物のガチ勢！</div>`;

  h += `<div class="rank-table">`;
  RANKS.forEach(x=>{ const me=x.name===rk.name?" me":""; h += `<div class="rank-row${me}"><span>${x.name}</span><span>${me?"◀ あなた":x.lbl}</span></div>`; });
  h += `</div>`;

  const shareText = `【平成あるある診断・${dlabel}】私のランクは「${rk.name}」！\n正解${score}/${total}・${secs}秒・推定上位${pct}%\nあなたは何ランク？ #平成あるある #平成偏差値`;
  h += `<button class="btn btn-primary" id="share">📸 結果を画像でシェア</button>`;
  h += `<button class="btn" id="shareLine">LINEで友達に送る</button>`;
  h += `<button class="btn" id="again">▶ もう一回（${dlabel}）</button>`;
  h += `<button class="btn" id="toShindan2">平成タイプ診断もやってみる ✨</button>`;
  h += `<button class="btn btn-ghost" id="toProf">マイ戦績（プロフ）を見る ▸</button>`;
  h += `<button class="btn btn-ghost" id="retry">難易度を選び直す</button>`;
  h += `<div class="credit">平成あるある診断 / prototype</div>`;
  app.innerHTML = h;
  document.getElementById("retry").addEventListener("click", renderStart);
  document.getElementById("again").addEventListener("click", ()=>startGame(diffKey));
  document.getElementById("toShindan2").addEventListener("click", startShindan);
  document.getElementById("toProf").addEventListener("click", renderProfile);
  document.getElementById("share").addEventListener("click", ()=> shareCard("capCard", shareText));
  document.getElementById("shareLine").addEventListener("click", openLine);

  // クラウドが有効なら、推定%を「本物の全体ランキング」に置き換える
  if(CLOUD_ON){
    saveResultToCloud(diffKey, score, total, secs, sc).then(r=>{
      const pill = document.getElementById("rankPill");
      const note = document.getElementById("rankNote");
      if(r && pill){
        pill.innerHTML = `<i class="ti ti-trophy"></i> 全${r.total_players}人中 ${r.rank}位（上位${r.top_percent}%）`;
        if(note) note.textContent = "リアルタイム全体ランキング";
      } else if(note){
        note.textContent = "※全体ランキングは接続待ち（推定値を表示中）";
      }
    });
  }
}

function renderProfile(){
  const best = loadBest();
  const sh = best.shindan;
  const curIcon = best.icon || (sh?sh.kao:"(･ω･)");
  const curIco = ICONS.find(i=>i.ic===best.icon);
  const avBg = curIco ? curIco.bg : "var(--pink-l)";
  const avFg = (curIco && curIco.fg) ? curIco.fg : "var(--pink-d)";
  let h = `<div class="center"><div style="width:64px;height:64px;border-radius:50%;background:${avBg};display:flex;align-items:center;justify-content:center;margin:10px auto 8px;color:${avFg};font-size:30px;border:3px solid #fff;box-shadow:0 0 0 3px var(--pink),3px 3px 0 rgba(192,36,107,.3)" class="kao">${curIcon}</div>`;
  h += `<div style="font-size:15px;font-weight:bold">あなたの平成プロフ</div>`;
  if(sh){ h += `<div class="pill" style="margin:6px 0">平成タイプ：${sh.name}</div>`; }
  else { h += `<div class="sub" style="margin:4px 0">平成タイプ診断は未挑戦</div>`; }
  h += `</div>`;
  const owned = ICONS.filter(i=>isUnlocked(i,best)).length;
  h += `<div class="center"><div class="sub" style="margin:2px 0 0">アイコン図鑑　<b style="color:var(--pink-d)">${owned}</b>/${ICONS.length}</div></div>`;
  h += `<div class="icons">`;
  ICONS.forEach(ico=>{
    const ok = isUnlocked(ico, best);
    const sel = best.icon===ico.ic;
    const cls = "ico-tile" + (ico.rare?" rare":"") + (ok?"":" locked") + (sel?" sel":"");
    const attr = ok ? ` data-ic="${ico.ic}"` : "";
    const title = ok ? ico.name : (ico.hint||"");
    h += `<div class="${cls}"${attr} title="${title}">`;
    h += `<div class="ico-c" style="background:${ico.bg};${ico.fg?'color:'+ico.fg:''}">${ico.ic}`;
    if(sel) h += `<span class="badge">✓</span>`;
    if(!ok) h += `<span class="lk">🔒</span>`;
    if(ico.rare) h += `<span class="rt">レア</span>`;
    h += `</div><div class="ico-name">${ok?ico.name:"？？？"}</div></div>`;
  });
  h += `</div>`;
  h += `<div class="sub center" style="font-size:11px;margin-bottom:8px">？？？はクイズ・診断の条件達成でゲット（ホバー/長押しで条件）</div>`;

  DIFF_ORDER.forEach(k=>{
    const p = POOLS[k]; const b = best[k];
    h += `<div class="prof-card"><div class="dh"><b>${p.label} <span class="kao">${p.kao}</span></b>`;
    h += b ? `<span class="r">${b.rank}</span>` : `<span class="r" style="color:var(--muted);font-size:14px">未挑戦</span>`;
    h += `</div>`;
    if(b){
      h += `<div class="prof-mini"><div>正解 ${b.correct}/${b.total}</div><div>${b.secs}秒</div><div>${b.score.toLocaleString()}pt</div><div>上位${b.pct}%</div></div>`;
    } else {
      h += `<div class="empty">挑戦するとここにランクが並びます</div>`;
    }
    h += `</div>`;
  });

  h += `<div class="ashiato"><div class="q-num">(´｀)ﾉ 足あと・いいね（STEP2で実装予定）</div>`;
  h += `<div class="lock">あなたのプロフを見に来た人の足あと／いいねがここに。<br>「全員見る」を“課金ポイント”にする予定。</div></div>`;
  h += `<button class="btn btn-primary" id="back">クイズに挑戦してランクUP ▸</button>`;
  h += `<div class="credit">平成あるある診断 / prototype</div>`;
  app.innerHTML = h;
  app.querySelectorAll(".ico-tile[data-ic]").forEach(b=> b.addEventListener("click", ()=>{
    const bb = loadBest(); bb.icon = b.dataset.ic; saveBest(bb); renderProfile();
  }));
  document.getElementById("back").addEventListener("click", renderStart);
}

renderStart();
</script>
